<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To-Do</title>
<style>
  :root {
    --bg: #ffffff; --fg: #111111; --muted: #888888; --line: #cccccc;
    --field: #ffffff; --btn: #eeeeee; --over: #cc0000; --link: #333355;
    color-scheme: light;
  }
  :root[data-theme=dark] {
    --bg: #16181d; --fg: #eeeeee; --muted: #9aa0a6; --line: #3a3d44;
    --field: #22252b; --btn: #2d3036; --over: #ff7b7b; --link: #aab4ff;
    color-scheme: dark;
  }
  body { font-family: system-ui, sans-serif; max-width: 460px; margin: 40px auto; padding: 0 16px;
         background: var(--bg); color: var(--fg); }
  h1 { text-align: center; color: var(--over); }

  /* always-visible dark / light switch */
  #theme { position: fixed; top: 12px; right: 12px; z-index: 10; width: 64px; height: 32px; padding: 0;
           border: 1px solid var(--line); border-radius: 16px; background: var(--btn); color: var(--fg);
           display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
  #theme .ico { width: 18px; height: 18px; margin: 0 7px; position: relative; z-index: 1; }
  #theme .knob { position: absolute; top: 2px; left: 2px; width: 26px; height: 26px; border-radius: 50%;
                 background: var(--bg); border: 1px solid var(--line); transition: transform .2s; }
  :root[data-theme=dark] #theme .knob { transform: translateX(30px); }

  /* category buttons */
  .cats { display: flex; flex-wrap: wrap; gap: 6px; }
  #form .cats { flex: 1 1 100%; }
  #filter { margin-top: 4px; }
  .flabel { margin-top: 16px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  button.cat { border: 2px solid var(--c); background: transparent; color: var(--fg); border-radius: 16px;
               padding: 9px 16px; font-size: 15px; cursor: pointer; }
  button.cat.on { background: var(--c); color: #fff; }

  form { display: flex; flex-wrap: wrap; gap: 8px; }
  input[type=text], input[type=date], input[type=time], form button {
    background: var(--field); color: var(--fg); border: 1px solid var(--line); border-radius: 4px;
  }
  form button { background: var(--btn); }
  input[type=text] { flex: 1 1 200px; padding: 8px; font-size: 16px; }
  input[type=date], input[type=time] { padding: 8px; font-size: 16px; }
  button { padding: 8px 12px; font-size: 16px; cursor: pointer; }
  ul { list-style: none; padding: 0; }
  .acts { display: flex; margin-left: auto; white-space: nowrap; }
  li small, li em, li button { white-space: nowrap; }
  li { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 6px 8px; margin-bottom: 8px;
       border-left: 5px solid var(--c); border-radius: 6px;
       background: color-mix(in srgb, var(--c) 18%, transparent); }
  li span { flex: 1 1 90px; min-width: 0; overflow-wrap: anywhere; }
  li span, li small, li em { cursor: text; }
  li.done span { text-decoration: line-through; color: var(--muted); }
  li small { background: var(--c); color: #fff; border-radius: 10px; padding: 2px 8px; font-size: 12px; }
  li em { font-style: normal; font-size: 12px; color: var(--muted); }
  li em.over { color: var(--over); font-weight: bold; }
  li button { border: none; background: none; padding: 8px 10px; color: var(--fg); } /* ~44px touch target */
  li button[data-act=edit], li button[data-act=del] { font-size: 24px; line-height: 1; }
  li button[data-act=save], li button[data-act=cancel] { color: var(--link); }
  li input[type=text] { flex: 1 1 120px; min-width: 0; padding: 4px; font-size: 15px; }
  li input[type=date], li input[type=time] { padding: 4px; font-size: 15px; }
  li .cats { flex: 1 1 100%; }
</style>
</head>
<body>
<button id="theme" type="button" role="switch" aria-checked="false" aria-label="Dark mode" title="Switch dark / light mode">
  <span class="knob"></span>
  <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
    <circle cx="12" cy="12" r="4" fill="currentColor"/>
    <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
  </svg>
  <svg class="ico" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
  </svg>
</button>
<h1>To-Do</h1>
<form id="form">
  <input type="text" id="text" placeholder="What needs doing?" autocomplete="off" required>
  <div id="cat"></div>
  <input type="date" id="due" title="Due date (optional)">
  <input type="time" id="duet" title="Due time (optional)">
  <button>Add</button>
</form>
<div class="flabel">Filter list by category</div>
<div id="filter"></div>
<ul id="list"></ul>

<script>
  const PRESETS = { Work: '#2563eb', Personal: '#7c3aed', Others: '#d97706' };
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } };
  const put = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

  let todos = load('todos', []);
  todos.forEach(t => { if (!PRESETS[t.cat]) t.cat = 'Others'; }); // older entries -> Others
  let editingId = null;

  const list = document.getElementById('list');
  const form = document.getElementById('form');
  const input = document.getElementById('text');
  const dueInput = document.getElementById('due');
  const timeInput = document.getElementById('duet');
  const themeBtn = document.getElementById('theme');

  // ---- dark / light mode ----
  let theme = load('theme', null) ||
    (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  function applyTheme() {
    document.documentElement.dataset.theme = theme;
    themeBtn.setAttribute('aria-checked', theme === 'dark');
  }
  themeBtn.addEventListener('click', () => {
    theme = theme === 'dark' ? 'light' : 'dark';
    put('theme', theme);
    applyTheme();
  });
  applyTheme();

  // ---- helpers ----
  const catOf = t => PRESETS[t.cat] ? t.cat : 'Others';
  const fmt = (d, t) => { const [y, m, dd] = d.split('-'); return dd + ' ' + MON[m - 1] + ' ' + y + (t ? ' ' + t : ''); };
  const sortKey = t => t.due ? t.due + ' ' + (t.time || '23:59') : '9999';

  // A row of clickable category buttons; the chosen one is in box.dataset.value.
  function catPicker(value, opts = {}) {
    const box = document.createElement('div');
    box.className = 'cats';
    box.dataset.value = value;
    const names = opts.all ? ['All', ...Object.keys(PRESETS)] : Object.keys(PRESETS);
    for (const c of names) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'cat' + (c === value ? ' on' : '');
      b.textContent = c;
      b.dataset.cat = c;
      b.style.setProperty('--c', PRESETS[c] || 'var(--muted)');
      box.append(b);
    }
    box.addEventListener('click', e => {
      const b = e.target.closest('button[data-cat]');
      if (!b) return;
      box.dataset.value = b.dataset.cat;
      box.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
      if (opts.onPick) opts.onPick(b.dataset.cat);
    });
    return box;
  }

  const catBox = catPicker('Others');
  catBox.id = 'cat';
  document.getElementById('cat').replaceWith(catBox);
  const filterBox = catPicker('All', { all: true, onPick: () => render() });
  filterBox.id = 'filter';
  document.getElementById('filter').replaceWith(filterBox);

  function render() {
    const n = new Date(), pad = x => String(x).padStart(2, '0');
    const nowKey = n.toLocaleDateString('en-CA') + ' ' + pad(n.getHours()) + ':' + pad(n.getMinutes());

    const current = filterBox.dataset.value;
    const shown = todos
      .filter(t => current === 'All' || catOf(t) === current)
      .sort((a, b) =>
        (Number(!!a.done) - Number(!!b.done)) ||            // done items go to the bottom
        (sortKey(a) < sortKey(b) ? -1 : sortKey(a) > sortKey(b) ? 1 : 0)); // then closest due date first

    list.innerHTML = '';
    for (const t of shown) {
      const li = document.createElement('li');
      li.dataset.id = t.id;
      li.style.setProperty('--c', PRESETS[catOf(t)]);
      if (t.done) li.className = 'done';

      if (t.id === editingId) {
        li.classList.add('editing');
        const mk = (txt, act, title) => {
          const b = document.createElement('button');
          b.type = 'button'; b.textContent = txt; b.dataset.act = act; b.title = title;
          return b;
        };
        const ti = document.createElement('input');
        ti.type = 'text'; ti.className = 'et'; ti.value = t.text;
        const ci = catPicker(catOf(t));
        ci.classList.add('ec');
        const di = document.createElement('input');
        di.type = 'date'; di.className = 'ed'; di.value = t.due || '';
        const hi = document.createElement('input');
        hi.type = 'time'; hi.className = 'eh'; hi.value = t.time || '';
        li.append(ti, ci, di, hi, mk('✓', 'save', 'Save'), mk('✗', 'cancel', 'Cancel'));
        list.append(li);
        ti.focus();
        continue;
      }

      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = t.done;

      const span = document.createElement('span');
      span.textContent = t.text;
      span.title = 'Click to edit';

      const badge = document.createElement('small');
      badge.textContent = catOf(t);

      li.append(cb, span, badge);

      if (t.due) {
        const due = document.createElement('em');
        due.textContent = 'Due ' + fmt(t.due, t.time);
        if (!t.done && sortKey(t) < nowKey) due.className = 'over';
        li.append(due);
      }

      const edit = document.createElement('button');
      edit.type = 'button'; edit.textContent = '✎'; edit.title = 'Edit'; edit.dataset.act = 'edit';
      const del = document.createElement('button');
      del.type = 'button'; del.textContent = '🗑'; del.title = 'Delete'; del.dataset.act = 'del';

      const acts = document.createElement('div');
      acts.className = 'acts';
      acts.append(edit, del);
      li.append(acts);
      list.append(li);
    }
  }

  function save() { put('todos', todos); }

  function commitEdit(li) {
    const text = li.querySelector('.et').value.trim();
    if (!text) return false;
    const t = todos.find(t => t.id === Number(li.dataset.id));
    t.text = text;
    t.cat = li.querySelector('.ec').dataset.value || 'Others';
    t.due = li.querySelector('.ed').value;
    t.time = t.due ? li.querySelector('.eh').value : '';
    editingId = null;
    save(); render();
    return true;
  }

  form.addEventListener('submit', e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    todos.push({
      id: Date.now() * 1000 + Math.floor(Math.random() * 1000), text, done: false,
      cat: catBox.dataset.value || 'Others',
      due: dueInput.value,
      time: dueInput.value ? timeInput.value : ''
    });
    input.value = '';
    dueInput.value = '';
    timeInput.value = '';
    save(); render();
  });

  list.addEventListener('keydown', e => {
    const li = e.target.closest('li');
    if (!li || !e.target.matches('.et, .ed, .eh')) return;
    if (e.key === 'Enter') commitEdit(li);
    else if (e.key === 'Escape') { editingId = null; render(); }
  });

  list.addEventListener('click', e => {
    const li = e.target.closest('li');
    if (!li) return;
    const id = Number(li.dataset.id);
    const act = e.target.dataset.act;
    if (act === 'del') {
      todos = todos.filter(t => t.id !== id);
    } else if (act === 'edit') {
      editingId = id; render(); return;
    } else if (act === 'cancel') {
      editingId = null; render(); return;
    } else if (act === 'save') {
      commitEdit(li); return;
    } else if (e.target.type === 'checkbox') {
      const t = todos.find(t => t.id === id);
      t.done = e.target.checked;
    } else if (e.target.matches('span, small, em') && editingId !== id) {
      editingId = id; render(); return;
    } else return;
    save(); render();
  });

  render();
</script>
</body>
</html>
